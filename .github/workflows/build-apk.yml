name: Compilar APK de SMS 5 minutos

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Generar APK firmada
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restaurar clave privada de firma
        env:
          SMS_KEYSTORE_BASE64: ${{ secrets.SMS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SMS_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto SMS_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$SMS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sms5min-release.jks"

      - name: Compilar APK de lanzamiento
        env:
          SMS_KEYSTORE_PATH: ${{ runner.temp }}/sms5min-release.jks
          SMS_KEYSTORE_PASSWORD: ${{ secrets.SMS_KEYSTORE_PASSWORD }}
          SMS_KEY_ALIAS: ${{ secrets.SMS_KEY_ALIAS }}
          SMS_KEY_PASSWORD: ${{ secrets.SMS_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/fugaz-build.log"

      # Keep diagnostics accessible through the Checks API when sandbox access to
      # GitHub's separate log/artifact storage hosts is unavailable.
      - name: Anotar errores de compilación o pruebas
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def annotate(text):
              escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + escaped)
          log = Path(os.environ['RUNNER_TEMP']) / 'fugaz-build.log'
          if log.exists():
              annotate(log.read_text(errors='replace')[-14000:])
          for report in Path('app/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for failure in case.findall('failure'):
                      annotate(case.get('name', '') + ': ' + (failure.text or '')[:12000])

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: SMS-5-minutos-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
