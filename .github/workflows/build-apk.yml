name: Compilar APK de SMS 5 minutos

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Generar APK firmada
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restaurar clave privada de firma
        env:
          SMS_KEYSTORE_BASE64: ${{ secrets.SMS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SMS_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto SMS_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$SMS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sms5min-release.jks"

      - name: Compilar APK de lanzamiento
        env:
          SMS_KEYSTORE_PATH: ${{ runner.temp }}/sms5min-release.jks
          SMS_KEYSTORE_PASSWORD: ${{ secrets.SMS_KEYSTORE_PASSWORD }}
          SMS_KEY_ALIAS: ${{ secrets.SMS_KEY_ALIAS }}
          SMS_KEY_PASSWORD: ${{ secrets.SMS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: SMS-5-minutos-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
