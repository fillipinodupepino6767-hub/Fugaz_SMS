name: Compilar APK de SMS 5 minutos

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Generar APK firmada
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restaurar clave privada de firma
        env:
          SMS_KEYSTORE_BASE64: ${{ secrets.SMS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SMS_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto SMS_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$SMS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sms5min-release.jks"

      - name: Compilar APK de lanzamiento
        env:
          SMS_KEYSTORE_PATH: ${{ runner.temp }}/sms5min-release.jks
          SMS_KEYSTORE_PASSWORD: ${{ secrets.SMS_KEYSTORE_PASSWORD }}
          SMS_KEY_ALIAS: ${{ secrets.SMS_KEY_ALIAS }}
          SMS_KEY_PASSWORD: ${{ secrets.SMS_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/fugaz-build.log"

      # Keep diagnostics accessible through the Checks API when sandbox access to
      # GitHub's separate log/artifact storage hosts is unavailable.
      - name: Anotar errores de compilación o pruebas
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def annotate(text):
              escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + escaped)
          log = Path(os.environ['RUNNER_TEMP']) / 'fugaz-build.log'
          if log.exists():
              annotate(log.read_text(errors='replace')[-14000:])
          for report in Path('app/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for failure in case.findall('failure'):
                      annotate(case.get('name', '') + ': ' + (failure.text or '')[:12000])

      - name: Comprobar que el APK está firmado
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::No se encontró el APK en $APK"
            exit 1
          fi
          # apksigner verifica la firma sin instalar nada. Un APK sin firmar o
          # con la firma equivocada NO se puede instalar en el teléfono, así que
          # aquí lo detectamos antes de publicarlo.
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/build-tools/36.0.0/apksigner" ]; then
            APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          else
            APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -r | head -1 || true)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::No se encontró apksigner; no se puede comprobar la firma"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" | head -40
          echo "Firma verificada correctamente."

          # Identity of the package, so an install problem on the phone can be
          # checked against these values without downloading anything.
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 -type f 2>/dev/null | sort -r | head -1 || true)
          if [ -n "$AAPT" ]; then
            echo "::group::Identidad del paquete"
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "^package|sdkVersion|targetSdkVersion" || true
            echo "::endgroup::"
          fi

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: SMS-5-minutos-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
