name: Compilar APK de SMS 5 minutos

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Generar APK de prueba
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The project intentionally has no checked-in Gradle wrapper. This action
      # downloads Gradle 8.7 temporarily inside GitHub's runner.
      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de depuración
        run: gradle :app:assembleDebug --no-daemon

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: SMS-5-minutos-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
