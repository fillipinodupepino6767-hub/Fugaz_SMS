plugins {
    id 'com.android.application'
}

// These values are supplied only by GitHub Actions secrets for release builds.
def releaseStorePath = System.getenv('SMS_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('SMS_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('SMS_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SMS_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// A release build without the signing secrets would quietly produce an
// UNSIGNED APK, which Android refuses to install ("no se puede instalar el
// paquete"). Failing the build loudly is much easier to diagnose than a
// mysterious install error on the phone.
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('assemblerelease') }
        && !hasReleaseSigning) {
    throw new GradleException(
            "Faltan los secretos de firma (SMS_KEYSTORE_PATH / SMS_KEYSTORE_PASSWORD / " +
            "SMS_KEY_ALIAS / SMS_KEY_PASSWORD). No se puede generar un APK instalable.")
}

android {
    namespace 'com.arena.autosms5min'
    compileSdk 36

    defaultConfig {
        // Keep this fixed. Changing it would make Android treat updates as a different app.
        applicationId 'com.arena.autosms5min'
        minSdk 23
        targetSdk 36
        versionCode 49
        versionName '0.28.11'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    // Gmail-style swipe in the inbox (RecyclerView + ItemTouchHelper).
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
