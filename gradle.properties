# Project-wide Gradle settings.
# Required since v18: the inbox uses AndroidX RecyclerView for Gmail-style swipe.
android.useAndroidX=true
# No legacy support libraries are used, so no Jetifier pass is needed.
android.enableJetifier=false
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true

# CI warns that AGP 8.6.1 is tested up to compileSdk 35; we target 36 on purpose (Android 16).
android.suppressUnsupportedCompileSdk=36
